name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        env:
          # Drops the local "dev-<hash>" version suffix so the release jar is named
          # Connector-1.0.0-beta.6+1.18.2.jar.
          PUBLISH_RELEASE_TYPE: beta
        run: ./gradlew build --no-daemon --stacktrace

      - name: Collect release jar
        run: |
          mkdir -p dist
          shopt -s nullglob
          for f in build/libs/*.jar; do
            case "$f" in
              *-sources.jar) continue ;;
              *-slim.jar) continue ;;
              *-deps.jar) continue ;;
              *-deps-reloc.jar) continue ;;
              *-mod.jar) continue ;;
              *-fabricloader.jar) continue ;;
              *-all.jar) continue ;;
              *-testmod.jar) continue ;;
            esac
            cp "$f" dist/
          done
          echo "Release assets:"
          ls -la dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Sinytra Connector ${{ github.ref_name }}
          body: |
            **Run Fabric mods on Forge.** This is a port of
            [Sinytra Connector](https://github.com/Sinytra/Connector) to Minecraft 1.18.2.

            ## Compatibility

            | | |
            | --- | --- |
            | Minecraft | 1.18.2 |
            | Forge | 40.3.12 or newer |
            | Java | 17 |
            | Requires | Forgified Fabric API 1.18.2 |

            ## What's inside

            - Loads Fabric mods on top of Forge 1.18.2, including the mixin, access widener and
              mod loader compatibility shims.

            ## Fixes in this build

            - **The vanilla-map fallback in `canRenderInLayer` now really runs.** The previous
              build only answered from the vanilla map when the predicate map returned `null` for
              a block, but Forge builds that map as a fastutil map with a solid-only
              `defaultReturnValue`, so `get` returns a non-null predicate for unknown blocks too
              and the fallback was dead code. The lookup now uses `containsKey`, which is true
              only for blocks that have a predicate entry of their own, so blocks registered
              directly into the vanilla map (or by an older Fabric API) are rendered with the
              layer they were registered with instead of falling through to the solid default.

            - **Forge's render layer predicate map now agrees with the vanilla one, so
              optimisation mods render Fabric blocks with the layer they were registered with.**
              Forge stores block and fluid render layers twice: the vanilla `f_109275_`/`f_109276_`
              maps, and a second, predicate-shaped copy (`blockRenderChecks`/`fluidRenderChecks`)
              that it derives from them *once*, in `ItemBlockRenderTypes`'s static initialiser, and
              never regenerates. `canRenderInLayer` answers from that copy - and so do the
              optimisation mods, whose `EmbeddiumRenderLayerCache` builds a state's render type
              list out of `ItemBlockRenderTypes.canRenderInLayer` - while vanilla's chunk builder
              reads the vanilla maps. Anything registered into the vanilla maps afterwards (which
              is what a mod does when it mixes into them directly, or when it registers through an
              older Fabric API) was invisible to the predicate map, which then fell back to its
              default predicate that only accepts the solid layer: such a block was rendered as
              solid, its texture's alpha channel was ignored, and the transparent pixels were
              drawn in their own colour - solid black or white faces for the road line and sign
              textures whose transparent pixels are black or near-white. `canRenderInLayer` now
              falls back to the vanilla map whenever a block or fluid has no predicate entry of
              its own, so both maps can no longer disagree. Blocks with an explicit predicate
              (including Forge's leaves special case) are untouched.

            ## Also in this line

            - **Cosmetic mod metadata can no longer abort Fabric mod discovery.**
              A Forge `mods.toml` is free-form TOML and Forge only requires it to be loosely well
              formed, so values read out of it cannot be assumed to have the shape Fabric would
              produce. `version`, `provides` and `license` are read defensively: a version string
              Fabric cannot parse no longer aborts the scan (the mod is kept with a neutral
              version and a warning is logged), the declared mod id list is flattened from
              whatever structure it really has instead of being cast to a string list, and a mod
              that declares no license no longer trips `List.of`'s null rejection. Discovery still
              never fails on metadata: anything that cannot be understood is logged and skipped.

            - **Mods whose `mods.toml` declares authors as TOML tables no longer crash the scan.**
              Cloth Config (and anything following the same style) writes
              `authors = [{ name = "shedaniel" }]`, which NightConfig represents as a list of
              config tables. The embedded loader assumed every author entry was a plain string
              and threw `ClassCastException: SimpleCommentedConfig cannot be cast to String`,
              aborting the whole Fabric mod discovery. Author entries of any structure are now
              flattened into name strings (keeping the `name` key of a table), and a malformed
              authors element is merely logged and ignored - it is cosmetic metadata and can
              never abort discovery again.

            - **A single oddly-named jar can no longer abort Fabric mod discovery.**
              The scanner opened every jar in `mods/` through `SecureJar`, which derives a JPMS
              module version from the *file name*. When that suffix looks like a pre-release -
              e.g. `...-1.0-1.18+.jar` - `ModuleDescriptor.Version.parse` rejects it with
              `IllegalArgumentException: 1.0-1.18+: Empty pre-release`, and since the call was
              unguarded the exception took the entire scan down with
              `Fabric mod discovery failed`, leaving Forge stuck during startup.

              Jars are now opened defensively: if the file name cannot be turned into a module
              version, the archive is inspected as a plain zip instead, which only reads entries
              and therefore cannot fail on a version string. **Which jar triggers it is
              incidental** - any jar whose name contains a pre-release-looking version behaves
              the same way, and this has nothing to do with the mod inside it. The fallback is
              silent by design: no error, no stack trace, and when no such jar is installed
              nothing is logged at all and every jar keeps using the fast path unchanged.

            - **Dedicated servers no longer crash while building the network pipeline.**
              The duplicate-network-handler guard was declared with an extra `ChannelPipeline`
              parameter that the target lambda does not have, so the mixin failed to apply and
              the server died during startup. The parameter has been removed and the pipeline is
              now reached through the `Connection` instead.

            ## Installation

            1. Install Minecraft Forge 40.3.x for Minecraft 1.18.2.
            2. Put this jar and `ForgifiedFabricAPI-1.18.2` into your `mods/` folder.
            3. Put any Fabric mods you want to use into the same folder.

            ## Building from source

            ```bash
            ./gradlew build
            ```

            Requires JDK 17. Builds run automatically on every push and on every release tag.
          files: dist/*.jar
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
