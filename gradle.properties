versionAdapterRuntime=1.0.0

versionMc=1.18.2
versionForge=40.3.12
# Upstream artifact, NOT a local build: ForgeAutoRenamingTool is a pure bytecode
# renamer (zero Minecraft references), so the published 1.0.14 works on 1.18.2 as-is.
# It is a *thin* jar (66 classes) and Connector's `shade` config is isTransitive=false,
# so this must stay a thin jar - never a shadow/`-all` artifact.
versionForgeAutoRenamingTool=1.0.14
