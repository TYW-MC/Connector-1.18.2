# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US
org.gradle.daemon=true

# ============================================================================
# TARGET: Minecraft 1.18.2 / Forge 40.3.12
#
# Ported down from the upstream 1.20.1 branch.
#
# NOTE: Gradle properties have NO inline-comment support. A trailing "# ..."
# becomes part of the value. Keep every comment on its own line.
#
# Entries marked "TODO local build" have no published 1.18.2 artifact and must
# be built from source. See ROADMAP.md for the build order. Until those local
# artifacts exist in mavenLocal(), dependency resolution will (correctly) fail.
# ============================================================================

versionConnector=1.0.0-beta.3

# TODO local build -> F:\Adapter-1.18.2 (:definition jar)
versionAdapter=1.11.67-1.18.2
