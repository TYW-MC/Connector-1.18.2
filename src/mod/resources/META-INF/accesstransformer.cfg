# Runtime-only access transformer to help Fabric mods access Forge getters
# See dev.su5ed.sinytra.connector.transformer.FieldToMethodTransformer for more information
# NOTE: a lone "#" separator line is NOT safe here. The 1.18.2 AccessTransformer
# tokenizer (accesstransformers 8.2.14, AccessTransformerList#tokenize) only drops a line as a
# comment when it starts with '#' AND has more than one character, or when the '#' is preceded
# by whitespace. A one-character "#" line tokenizes to ["#"], i.e. one token, and the loader
# then rejects the whole file with "Invalid access transformer line". Keep every comment on a
# line that carries actual text.
# 1.18.2 note: SRG member names are assigned once by MCPConfig and then reused, so the two
# `public-f` entries below were carried over from the 1.20.1 set and verified against the
# 1.18.2 joined mappings:
#   f_22241_ -> net/minecraft/world/entity/ai/attributes/AttributeSupplier.instances
#   m_7942_  -> net/minecraft/core/IdMapper.byId   (still `final` in 1.18.2, definalised here
#                                                   so Connector's redirecting IdMapper can
#                                                   override it)
# Entries whose targets only exist from 1.19/1.20 onwards were dropped:
#   net.minecraft.core.registries.BuiltInRegistries            (1.19.3+)
#   net.minecraft.tags.TagEntry                                (1.19.3+, 1.18.2 uses Tag.TagEntry)
#   Sheets.createHangingSignMaterial / createDecoratedPotMaterial / createBannerMaterial
#                                                              (1.20+)
# Sheets.createSignMaterial is not widened either - 1.18.2 has a public
# Sheets.addWoodType(WoodType) that LateSheetsInit uses instead.
public net.minecraft.world.item.MobBucketItem getFishType()Lnet/minecraft/world/entity/EntityType; # getFishType
public net.minecraft.world.item.MobBucketItem getEmptySound()Lnet/minecraft/sounds/SoundEvent; # getEmptySound

public-f net.minecraft.core.IdMapper m_7942_(I)Ljava/lang/Object; # byId
public-f net.minecraft.world.entity.ai.attributes.AttributeSupplier f_22241_ # instances

# 1.20.1 has a single `TagEntry` record with a public getId(). 1.18.2 splits it into four
# classes and only Tag$TagEntry kept the getter; the other three hide the id behind a
# private field, so widen them for compat/TagConverter:
#   Tag$ElementEntry.id         (f_13349_) - required element reference
#   Tag$OptionalElementEntry.id (f_13363_) - optional element reference
#   Tag$OptionalTagEntry.id     (f_13373_) - optional tag reference
public net.minecraft.tags.Tag$ElementEntry f_13349_ # id
public net.minecraft.tags.Tag$OptionalElementEntry f_13363_ # id
public net.minecraft.tags.Tag$OptionalTagEntry f_13373_ # id

